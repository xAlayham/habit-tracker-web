<!-- A streak count starting at 0 -->
<!-- A "Complete today" button that increments it by 1 each click-->
<!-- A second element that shows "Milestone!" whenever the streak is a multiple of 5, and is empty otherwise-->

<p id="streak-count">Count: 0</p>
<button id="complete-today">Complete today</button>
<p id="milestone-display"></p>

<script>
    let count = 0;
    const countDisplay = document.getElementById("streak-count")
    const milestoneDisplay = document.getElementById("milestone-display")
    const button = document.getElementById("complete-today")

    button.addEventListener("click", () => {
        count = count + 1;
        countDisplay.textContent = `Count: ${count}`;
        milestoneDisplay.textContent = count % 5 === 0 ? "Milestone!" : "";
    });
</script>
